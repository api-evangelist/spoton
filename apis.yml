aid: spoton
name: SpotOn
description: >-
  SpotOn is an all-in-one restaurant point-of-sale and management platform that combines POS, online ordering,
  reservations, payments, labor, and reporting for restaurants and hospitality businesses. For developers and
  integration partners, SpotOn offers the Restaurant POS Export API, a location-centric REST API that delivers
  close-to-realtime data export from the SpotOn Restaurant POS System. It exposes resources such as orders, menu items,
  modifiers, employees, taxes, surcharges, payment options, labor reports, and time clock entries. Authentication uses
  an API key supplied via the x-api-key request header, with access granted on a per-location basis. SpotOn also
  publishes the Reserve API (powered by SeatNinja) for its reservations and waitlist product.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - Restaurant
  - Point of Sale
  - Payments
  - Online Ordering
  - Reservations
  - Reporting
url: https://raw.githubusercontent.com/api-evangelist/spoton/refs/heads/main/apis.yml
