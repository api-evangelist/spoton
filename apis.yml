    description: >-
      A location-centric REST API providing close-to-realtime data export from the SpotOn Restaurant POS System.
      Resources include orders, order types, menu items, payment options, employees, job positions, time clock entries,
      paid in/outs, cash deposits, locations, and report categories. Authentication uses an API key passed in the
      x-api-key request header, with access scoped per location.
    humanURL: https://developers.spoton.com/restaurant/docs/introduction
    baseURL: https://restaurantapi.spoton.com/posexport/v1
