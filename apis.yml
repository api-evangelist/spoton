  - aid: spoton:reserve-api
    name: SpotOn Reserve API
    description: >-
      An API for SpotOn Reserve (powered by SeatNinja), the company's reservations and waitlist product, allowing
      partners to list accessible restaurants, check available reservation times and wait times, create reservations,
      and add guests to a waitlist. Authentication uses an API key passed in the x-api-key request header, scoped per
      restaurant.
    humanURL: https://developers.spoton.com/reserve/docs/getting-started
    baseURL: https://api.seatninja.com
    tags:
      - Reservations
      - Waitlist
      - Availability
