naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Job Positions
  description: 'Job Positions surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Job Positions. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Job Positions
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-job-positions
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Job Positions business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-job-positions
      path: /locations/{locationId}/job-positions
      operations:
      - name: listJobPositions
        method: GET
        description: SpotOn List Job Positions
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-job-positions-jobpositionid
      path: /locations/{locationId}/job-positions/{jobPositionId}
      operations:
      - name: getJobPosition
        method: GET
        description: SpotOn Get Job Position
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: jobPositionId
          in: path
          type: string
          required: true
          description: The unique identifier for the job position.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-job-positions-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Job Positions. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-job-positions
      name: locations-locationid-job-positions
      description: REST surface for SpotOn List Job Positions.
      operations:
      - method: GET
        name: listJobPositions
        description: SpotOn List Job Positions
        call: restaurant-pos-export-job-positions.listJobPositions
        with:
          locationId: rest.locationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-job-positions-jobpositionid
      name: locations-locationid-job-positions-jobpositionid
      description: REST surface for SpotOn Get Job Position.
      operations:
      - method: GET
        name: getJobPosition
        description: SpotOn Get Job Position
        call: restaurant-pos-export-job-positions.getJobPosition
        with:
          locationId: rest.locationId
          jobPositionId: rest.jobPositionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-job-positions-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Job Positions. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-job-positions
      description: SpotOn List Job Positions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-job-positions.listJobPositions
      with:
        locationId: tools.locationId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-job-position
      description: SpotOn Get Job Position
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-job-positions.getJobPosition
      with:
        locationId: tools.locationId
        jobPositionId: tools.jobPositionId
      outputParameters:
      - type: object
        mapping: $.
