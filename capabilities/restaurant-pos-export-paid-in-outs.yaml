naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Paid In Outs
  description: 'Paid In Outs surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Paid in Outs. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Paid In Outs
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-paid-in-outs
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Paid In Outs business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-paid-in-outs
      path: /locations/{locationId}/paid-in-outs
      operations:
      - name: listPaidInOuts
        method: GET
        description: SpotOn List Paid in Outs
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: createdAtStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start of the creation range. Max 7-day range.
        - name: createdAtEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end of the creation range. Must be at least 5 minutes in the past.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-paid-in-outs-paidinoutid
      path: /locations/{locationId}/paid-in-outs/{paidInOutId}
      operations:
      - name: getPaidInOut
        method: GET
        description: SpotOn Get Paid in Out
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: paidInOutId
          in: path
          type: string
          required: true
          description: The unique identifier for the paid in/out record.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-paid-in-outs-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Paid In Outs. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-paid-in-outs
      name: locations-locationid-paid-in-outs
      description: REST surface for SpotOn List Paid in Outs.
      operations:
      - method: GET
        name: listPaidInOuts
        description: SpotOn List Paid in Outs
        call: restaurant-pos-export-paid-in-outs.listPaidInOuts
        with:
          locationId: rest.locationId
          createdAtStart: rest.createdAtStart
          createdAtEnd: rest.createdAtEnd
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-paid-in-outs-paidinoutid
      name: locations-locationid-paid-in-outs-paidinoutid
      description: REST surface for SpotOn Get Paid in Out.
      operations:
      - method: GET
        name: getPaidInOut
        description: SpotOn Get Paid in Out
        call: restaurant-pos-export-paid-in-outs.getPaidInOut
        with:
          locationId: rest.locationId
          paidInOutId: rest.paidInOutId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-paid-in-outs-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Paid In Outs. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-paid-outs
      description: SpotOn List Paid in Outs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-paid-in-outs.listPaidInOuts
      with:
        locationId: tools.locationId
        createdAtStart: tools.createdAtStart
        createdAtEnd: tools.createdAtEnd
      outputParameters:
      - type: object
        mapping: $.
    - name: get-paid-out
      description: SpotOn Get Paid in Out
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-paid-in-outs.getPaidInOut
      with:
        locationId: tools.locationId
        paidInOutId: tools.paidInOutId
      outputParameters:
      - type: object
        mapping: $.
