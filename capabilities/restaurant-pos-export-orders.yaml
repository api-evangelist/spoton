naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Orders
  description: 'Orders surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Orders. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Orders
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-orders
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Orders business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-orders
      path: /locations/{locationId}/orders
      operations:
      - name: listOrders
        method: GET
        description: SpotOn List Orders
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: updatedAtStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start of the update range. Max 26-hour range, no milliseconds.
        - name: updatedAtEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end of the update range. Must be at least 5 minutes in the past.
        - name: createdAtStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start of the creation range. Max 26-hour range, no milliseconds.
        - name: createdAtEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end of the creation range. Must be at least 5 minutes in the past.
        - name: closedAtStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start of the closure range. Max 26-hour range, no milliseconds.
        - name: closedAtEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end of the closure range. Must be at least 5 minutes in the past.
        - name: includeUpdatedActivity
          in: query
          type: boolean
          required: false
          description: Return previously created or closed orders that were subsequently updated. Only valid with createdAt or closedAt ranges.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-orders-orderid
      path: /locations/{locationId}/orders/{orderId}
      operations:
      - name: getOrder
        method: GET
        description: SpotOn Get Order
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: orderId
          in: path
          type: string
          required: true
          description: The unique identifier for the order.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-orders-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Orders. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-orders
      name: locations-locationid-orders
      description: REST surface for SpotOn List Orders.
      operations:
      - method: GET
        name: listOrders
        description: SpotOn List Orders
        call: restaurant-pos-export-orders.listOrders
        with:
          locationId: rest.locationId
          updatedAtStart: rest.updatedAtStart
          updatedAtEnd: rest.updatedAtEnd
          createdAtStart: rest.createdAtStart
          createdAtEnd: rest.createdAtEnd
          closedAtStart: rest.closedAtStart
          closedAtEnd: rest.closedAtEnd
          includeUpdatedActivity: rest.includeUpdatedActivity
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-orders-orderid
      name: locations-locationid-orders-orderid
      description: REST surface for SpotOn Get Order.
      operations:
      - method: GET
        name: getOrder
        description: SpotOn Get Order
        call: restaurant-pos-export-orders.getOrder
        with:
          locationId: rest.locationId
          orderId: rest.orderId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Orders. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-orders
      description: SpotOn List Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-orders.listOrders
      with:
        locationId: tools.locationId
        updatedAtStart: tools.updatedAtStart
        updatedAtEnd: tools.updatedAtEnd
        createdAtStart: tools.createdAtStart
        createdAtEnd: tools.createdAtEnd
        closedAtStart: tools.closedAtStart
        closedAtEnd: tools.closedAtEnd
        includeUpdatedActivity: tools.includeUpdatedActivity
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order
      description: SpotOn Get Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-orders.getOrder
      with:
        locationId: tools.locationId
        orderId: tools.orderId
      outputParameters:
      - type: object
        mapping: $.
