naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Payment Options
  description: 'Payment Options surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Payment Options. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Payment Options
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-payment-options
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Payment Options business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-payment-options
      path: /locations/{locationId}/payment-options
      operations:
      - name: listPaymentOptions
        method: GET
        description: SpotOn List Payment Options
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-payment-options-paymentoptionid
      path: /locations/{locationId}/payment-options/{paymentOptionId}
      operations:
      - name: getPaymentOption
        method: GET
        description: SpotOn Get Payment Option
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: paymentOptionId
          in: path
          type: string
          required: true
          description: The unique identifier for the payment option.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-payment-options-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Payment Options. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-payment-options
      name: locations-locationid-payment-options
      description: REST surface for SpotOn List Payment Options.
      operations:
      - method: GET
        name: listPaymentOptions
        description: SpotOn List Payment Options
        call: restaurant-pos-export-payment-options.listPaymentOptions
        with:
          locationId: rest.locationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-payment-options-paymentoptionid
      name: locations-locationid-payment-options-paymentoptionid
      description: REST surface for SpotOn Get Payment Option.
      operations:
      - method: GET
        name: getPaymentOption
        description: SpotOn Get Payment Option
        call: restaurant-pos-export-payment-options.getPaymentOption
        with:
          locationId: rest.locationId
          paymentOptionId: rest.paymentOptionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-payment-options-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Payment Options. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-payment-options
      description: SpotOn List Payment Options
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-payment-options.listPaymentOptions
      with:
        locationId: tools.locationId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-payment-option
      description: SpotOn Get Payment Option
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-payment-options.getPaymentOption
      with:
        locationId: tools.locationId
        paymentOptionId: tools.paymentOptionId
      outputParameters:
      - type: object
        mapping: $.
