naftiko: 1.0.0-alpha2
info:
  label: SpotOn Reserve API — Waitlist
  description: 'Waitlist surface of the SpotOn Reserve API. 1 operation. Lead operation: Add to Waitlist. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Reservations
  - Waitlist
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: reserve-waitlist
    baseUri: https://api.seatninja.com
    description: SpotOn Reserve API — Waitlist business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: v2-reservations-restaurantid-waitlist
      path: /v2/reservations/{restaurantId}/waitlist
      operations:
      - name: addToWaitlist
        method: POST
        description: SpotOn Add to Waitlist
        inputParameters:
        - name: restaurantId
          in: path
          type: integer
          required: true
          description: The unique identifier for the restaurant.
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: reserve-waitlist-rest
    port: 8080
    description: REST adapter for SpotOn Reserve API — Waitlist. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2-reservations-restaurantid-waitlist
      name: v2-reservations-restaurantid-waitlist
      description: REST surface for SpotOn Add to Waitlist.
      operations:
      - method: POST
        name: addToWaitlist
        description: SpotOn Add to Waitlist
        call: reserve-waitlist.addToWaitlist
        with:
          restaurantId: rest.restaurantId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: reserve-waitlist-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Reserve API — Waitlist. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: add-waitlist
      description: SpotOn Add to Waitlist
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: reserve-waitlist.addToWaitlist
      with:
        restaurantId: tools.restaurantId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
