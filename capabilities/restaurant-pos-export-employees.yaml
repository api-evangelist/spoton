naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Employees
  description: 'Employees surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Employees. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Employees
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-employees
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Employees business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-employees
      path: /locations/{locationId}/employees
      operations:
      - name: listEmployees
        method: GET
        description: SpotOn List Employees
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-employees-employeeid
      path: /locations/{locationId}/employees/{employeeId}
      operations:
      - name: getEmployee
        method: GET
        description: SpotOn Get Employee
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: employeeId
          in: path
          type: string
          required: true
          description: The unique identifier for the employee.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-employees-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Employees. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-employees
      name: locations-locationid-employees
      description: REST surface for SpotOn List Employees.
      operations:
      - method: GET
        name: listEmployees
        description: SpotOn List Employees
        call: restaurant-pos-export-employees.listEmployees
        with:
          locationId: rest.locationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-employees-employeeid
      name: locations-locationid-employees-employeeid
      description: REST surface for SpotOn Get Employee.
      operations:
      - method: GET
        name: getEmployee
        description: SpotOn Get Employee
        call: restaurant-pos-export-employees.getEmployee
        with:
          locationId: rest.locationId
          employeeId: rest.employeeId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-employees-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Employees. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-employees
      description: SpotOn List Employees
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-employees.listEmployees
      with:
        locationId: tools.locationId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-employee
      description: SpotOn Get Employee
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-employees.getEmployee
      with:
        locationId: tools.locationId
        employeeId: tools.employeeId
      outputParameters:
      - type: object
        mapping: $.
