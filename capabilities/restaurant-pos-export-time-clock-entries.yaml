naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Time Clock Entries
  description: 'Time Clock Entries surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Time Clock Entries. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Time Clock Entries
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-time-clock-entries
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Time Clock Entries business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-time-clock-entries
      path: /locations/{locationId}/time-clock-entries
      operations:
      - name: listTimeClockEntries
        method: GET
        description: SpotOn List Time Clock Entries
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: updatedAtStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start of the update range.
        - name: updatedAtEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end of the update range.
        - name: inStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start for shift clock-in times.
        - name: inEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end for shift clock-in times.
        - name: outStart
          in: query
          type: string
          required: false
          description: Inclusive RFC 3339 start for shift clock-out times.
        - name: outEnd
          in: query
          type: string
          required: false
          description: Exclusive RFC 3339 end for shift clock-out times.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-time-clock-entries-timeclockentryid
      path: /locations/{locationId}/time-clock-entries/{timeClockEntryId}
      operations:
      - name: getTimeClockEntry
        method: GET
        description: SpotOn Get Time Clock Entry
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: timeClockEntryId
          in: path
          type: string
          required: true
          description: The unique identifier for the time clock entry.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-time-clock-entries-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Time Clock Entries. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-time-clock-entries
      name: locations-locationid-time-clock-entries
      description: REST surface for SpotOn List Time Clock Entries.
      operations:
      - method: GET
        name: listTimeClockEntries
        description: SpotOn List Time Clock Entries
        call: restaurant-pos-export-time-clock-entries.listTimeClockEntries
        with:
          locationId: rest.locationId
          updatedAtStart: rest.updatedAtStart
          updatedAtEnd: rest.updatedAtEnd
          inStart: rest.inStart
          inEnd: rest.inEnd
          outStart: rest.outStart
          outEnd: rest.outEnd
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-time-clock-entries-timeclockentryid
      name: locations-locationid-time-clock-entries-timeclockentryid
      description: REST surface for SpotOn Get Time Clock Entry.
      operations:
      - method: GET
        name: getTimeClockEntry
        description: SpotOn Get Time Clock Entry
        call: restaurant-pos-export-time-clock-entries.getTimeClockEntry
        with:
          locationId: rest.locationId
          timeClockEntryId: rest.timeClockEntryId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-time-clock-entries-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Time Clock Entries. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-time-clock-entries
      description: SpotOn List Time Clock Entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-time-clock-entries.listTimeClockEntries
      with:
        locationId: tools.locationId
        updatedAtStart: tools.updatedAtStart
        updatedAtEnd: tools.updatedAtEnd
        inStart: tools.inStart
        inEnd: tools.inEnd
        outStart: tools.outStart
        outEnd: tools.outEnd
      outputParameters:
      - type: object
        mapping: $.
    - name: get-time-clock-entry
      description: SpotOn Get Time Clock Entry
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-time-clock-entries.getTimeClockEntry
      with:
        locationId: tools.locationId
        timeClockEntryId: tools.timeClockEntryId
      outputParameters:
      - type: object
        mapping: $.
