naftiko: 1.0.0-alpha2
info:
  label: SpotOn Restaurant POS Export API — Report Categories
  description: 'Report Categories surface of the SpotOn Restaurant POS Export API. 2 operations. Lead operation: List Report Categories. Self-contained Naftiko capability covering one SpotOn business surface.'
  tags:
  - SpotOn
  - Restaurant
  - Report Categories
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    SPOTON_API_KEY: SPOTON_API_KEY
capability:
  consumes:
  - type: http
    namespace: restaurant-pos-export-report-categories
    baseUri: https://restaurantapi.spoton.com/posexport/v1
    description: SpotOn Restaurant POS Export API — Report Categories business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SPOTON_API_KEY}}'
      placement: header
    resources:
    - name: locations-locationid-report-categories
      path: /locations/{locationId}/report-categories
      operations:
      - name: listReportCategories
        method: GET
        description: SpotOn List Report Categories
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: locations-locationid-report-categories-reportcategoryid
      path: /locations/{locationId}/report-categories/{reportCategoryId}
      operations:
      - name: getReportCategory
        method: GET
        description: SpotOn Get Report Category
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: The unique identifier for the location.
        - name: reportCategoryId
          in: path
          type: string
          required: true
          description: The unique identifier for the report category.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-pos-export-report-categories-rest
    port: 8080
    description: REST adapter for SpotOn Restaurant POS Export API — Report Categories. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/locations-locationid-report-categories
      name: locations-locationid-report-categories
      description: REST surface for SpotOn List Report Categories.
      operations:
      - method: GET
        name: listReportCategories
        description: SpotOn List Report Categories
        call: restaurant-pos-export-report-categories.listReportCategories
        with:
          locationId: rest.locationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations-locationid-report-categories-reportcategoryid
      name: locations-locationid-report-categories-reportcategoryid
      description: REST surface for SpotOn Get Report Category.
      operations:
      - method: GET
        name: getReportCategory
        description: SpotOn Get Report Category
        call: restaurant-pos-export-report-categories.getReportCategory
        with:
          locationId: rest.locationId
          reportCategoryId: rest.reportCategoryId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-pos-export-report-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for SpotOn Restaurant POS Export API — Report Categories. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-report-categories
      description: SpotOn List Report Categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-report-categories.listReportCategories
      with:
        locationId: tools.locationId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-report-category
      description: SpotOn Get Report Category
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-pos-export-report-categories.getReportCategory
      with:
        locationId: tools.locationId
        reportCategoryId: tools.reportCategoryId
      outputParameters:
      - type: object
        mapping: $.
