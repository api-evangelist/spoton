specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: SpotOn
providerId: spoton
created: '2026-06-03'
modified: '2026-06-03'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Restaurant
  - Point of Sale
  - Payments
description: >-
  FOCUS-aligned FinOps for SpotOn: per-station software subscriptions plus
  per-transaction card-processing take rates, with per-employee add-ons, billed
  monthly to the restaurant merchant.
sources:
  - https://www.spoton.com/pricing/
  - https://developers.spoton.com/restaurant/docs/introduction
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: SpotOn Transact, LLC
serviceCategory: Restaurant Technology + Payments
billingModel:
  pricingCategory: Subscription + Take Rate
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Refund
    - Adjustment
focusColumns:
  ServiceName: SpotOn Restaurant
  ServiceCategory: Restaurant Technology + Payments
  ProviderName: SpotOn
  PublisherName: SpotOn Transact, LLC
  InvoiceIssuerName: SpotOn Transact, LLC
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: station_subscription
    unit: seat
    aggregation: max
    dimensions:
      - location
      - plan
  - name: employee_addon
    unit: seat
    aggregation: max
    dimensions:
      - location
  - name: card_transactions
    unit: transaction
    aggregation: count
    dimensions:
      - location
      - card_brand
      - entry_mode
  - name: card_volume
    unit: USD
    aggregation: sum
    dimensions:
      - location
      - card_brand
  - name: hardware_purchase
    unit: device
    aggregation: count
    dimensions:
      - location
principles:
  - name: Visibility
    description: >-
      Reconcile processing and tender activity by exporting orders, payments, and
      surcharges from the Restaurant POS Export API and matching them to monthly
      SpotOn merchant statements per location.
  - name: Allocation
    description: >-
      Attribute spend by location using the per-location scoping of the export
      API and the organizationId shared across a POS organization, then split by
      card brand and entry mode from the payment records.
  - name: Optimization
    description: >-
      Compare effective processing rates across plans (Quick Start 2.89% + $0.25
      vs POS Essentials 1.99% + $0.25) against monthly volume to choose the lower
      total-cost tier, and reduce manually-keyed transactions that carry higher
      rates.
  - name: Accountability
    description: >-
      Assign each location's GM ownership of station count, employee add-ons, and
      processing mix, reviewed monthly against exported POS totals.
